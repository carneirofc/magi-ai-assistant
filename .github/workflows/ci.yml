name: CI

# Quality + vulnerability gates for both libraries. Lint/typecheck/tests are
# blocking; dependency audits are advisory here (they surface in the logs) — the
# enforced vulnerability layer is CodeQL (codeql.yml) + Dependabot (dependabot.yml).
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: engine · lint · test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # All extras: the optional backends are lazy-imported, so typing them
      # needs them installed — and the type baseline is recorded against this
      # exact environment (see [tool.basedpyright] in pyproject.toml).
      - name: Sync (with dev group + all extras)
        run: uv sync --dev --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # New type errors fail; pre-existing ones are frozen in the baseline,
      # which basedpyright shrinks automatically as errors are fixed. A dirty
      # baseline afterwards means a fix landed without its shrunk baseline.
      - name: Typecheck (basedpyright)
        run: |
          uv run basedpyright
          git diff --exit-code -- .basedpyright/baseline.json

      - name: Tests
        run: uv run pytest -q

      # The ratchet: the committed baseline may only shrink relative to master.
      - name: Type baseline never grows
        if: github.event_name == 'pull_request'
        run: |
          count() { python3 -c 'import json,sys; print(sum(len(v) for v in json.load(sys.stdin)["files"].values()))'; }
          base=$(git show "origin/${{ github.base_ref }}:.basedpyright/baseline.json" 2>/dev/null | count || echo 999999)
          head=$(count < .basedpyright/baseline.json)
          echo "baseline: base=$base head=$head"
          test "$head" -le "$base"

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: |
          uv export --no-emit-project --format requirements-txt -o requirements.txt
          uvx pip-audit -r requirements.txt

  web:
    name: frontend · lint · typecheck · audit
    runs-on: ubuntu-latest
    # Overrides the workflow default so the job token can read @carneirofc/ui
    # from GitHub Packages (same owner) during install.
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@carneirofc"

      # The workspace root links @carneirofc/ui from a sibling checkout for
      # local co-development; that path doesn't exist in CI, so repoint the
      # root dep at the registry range and drop the stale lockfile (same step
      # as the publish workflows).
      - name: Use registry @carneirofc/ui in CI
        run: |
          npm pkg set 'dependencies.@carneirofc/ui=>=0.2.0'
          rm -f package-lock.json

      # Pulls @carneirofc/ui from GitHub Packages (same owner) with the job
      # token; links the @carneirofc/magi-web workspace.
      - name: Install workspace
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Biome lint + format
        run: npx biome ci .

      - name: Typecheck app + library
        run: |
          npm run typecheck
          npm run typecheck -w @carneirofc/magi-web

      - name: Dependency vulnerability audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
