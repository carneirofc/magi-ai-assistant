# Everything here is opt-in by profile — `docker compose up` alone starts
# nothing. The default deployment is bare-metal (`magi gateway install`,
# docs/getting-started.md); use these for the optional backends, or to run
# magi itself in a container.
#
#   docker compose --profile qdrant up -d        # semantic memory + knowledge
#   docker compose --profile s3 up -d            # RustFS byte archive (+ bucket)
#   docker compose --profile litellm up -d       # proxy to remote models (+ postgres, minio)
#   docker compose --profile monitoring up -d    # prometheus
#   docker compose --profile app up -d --build   # magi in a container (channels.enabled from magi.yaml)
#   docker compose --profile admin up -d --build # separate admin API + web BFF (ADR 0002)
#
# Profiles combine: `--profile app --profile qdrant`. Bake optional extras into
# the image with EXTRAS, e.g. EXTRAS="--extra telegram --extra semantic".

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.87.0
    container_name: chatbot-litellm
    profiles: ["litellm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
      DATABRICKS_API_BASE: ${DATABRICKS_API_BASE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
      LITELLM_CONTROL_PLANE_URL: ${LITELLM_CONTROL_PLANE_URL:-http://localhost:4000}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev-key}
      LITELLM_PROXY_BASE_URL: ${LITELLM_PROXY_BASE_URL:-http://localhost:4000}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-litellm-logs}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      LLAMACPP_API_BASE: ${LLAMACPP_API_BASE:-http://host.docker.internal:8080/v1}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      QDRANT_API_BASE: ${QDRANT_API_BASE:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command:
     - "--config=/app/config.yaml"
     - "--port=4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: chatbot-litellm-postgres
    profiles: ["litellm"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot-qdrant
    profiles: ["qdrant"]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      # The image ships bash but no curl: probe the HTTP port directly.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # RustFS — S3-compatible object storage. Backs the chatbot's durable file/image
  # archive (core/storage + agent/tools/storage, gated by config.s3_enabled). Holds
  # the canonical S3 ports 9000 (API) / 9001 (console) on the host so the chatbot's
  # default endpoint (http://localhost:9000) just works. Default creds rustfsadmin
  # /rustfsadmin — override with S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: chatbot-rustfs
    profiles: ["s3"]
    restart: unless-stopped
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot bucket creation for the chatbot archive (mc speaks S3 to any backend).
  rustfs-init:
    image: minio/mc:latest
    container_name: chatbot-rustfs-init
    profiles: ["s3"]
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs:9000 $${S3_ACCESS_KEY_ID:-rustfsadmin} $${S3_SECRET_ACCESS_KEY:-rustfsadmin} &&
      mc mb --ignore-existing rustfs/$${S3_BUCKET:-chatbot-memory} &&
      exit 0
      "
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-chatbot-memory}

  # MinIO — separate object store dedicated to LiteLLM's logs (litellm reaches it
  # by the internal name minio:9000, unaffected by host ports). Host ports moved to
  # 9100/9101 so RustFS can own the canonical 9000/9001 for the chatbot archive.
  minio:
    image: minio/minio:latest
    container_name: chatbot-minio
    profiles: ["litellm"]
    restart: unless-stopped
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: chatbot-minio-init
    profiles: ["litellm"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET_NAME:-litellm-logs} &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-litellm-logs}

  prometheus:
    image: prom/prometheus
    container_name: chatbot-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"


  # magi itself — every channel in channels.enabled (magi.yaml) in one process,
  # with the container overlay (bind 0.0.0.0, reach host services). Serve more
  # channels by listing them in magi.yaml or appending names to `command`.
  magi:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-}
    image: magi-app:local
    container_name: magi
    profiles: ["app"]
    restart: unless-stopped
    command: ["magi", "run", "-c", "magi.yaml", "-c", "docker/magi.docker.yaml"]
    ports:
      - "8000:8000"
    env_file:
      - .env                      # secrets only (API_AUTH_TOKEN, DISCORD_BOT_TOKEN, …)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so the container can reach host services
    volumes:
      - ./data:/app/data          # db, memory files, byte archive, MAGI_HOME
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Operator admin API as its own service (ADR 0002's separate posture). NOT
  # published — reachable only on the compose network, fronted by `web`. For a
  # single-operator setup, skip this profile: magi.yaml's admin_enabled mounts
  # /admin/v1/* on the app itself.
  admin-api:
    build:
      context: .
      args:
        EXTRAS: ${EXTRAS:-}
    image: magi-app:local
    container_name: magi-admin-api
    profiles: ["admin"]
    restart: unless-stopped
    command: ["magi", "run", "-c", "magi.yaml", "-c", "docker/magi.docker.yaml", "admin"]
    expose:
      - "8100"                    # compose-network only; no host `ports:` mapping
    env_file:
      - .env                      # ADMIN_AUTH_TOKEN, QDRANT_API_KEY, …
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data          # same memory tree as the chat app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Next.js admin UI + BFF (web/). The ONLY externally reachable admin surface:
  # holds ADMIN_AUTH_TOKEN server-side, gates the operator with a password →
  # httpOnly cookie, and proxies to admin-api over the compose network.
  web:
    build:
      context: ./web
      secrets:
        # The BFF depends on @carneirofc/ui (GitHub Packages): export
        # NODE_AUTH_TOKEN (read:packages) before `up --build`. Passed as a build
        # secret so it never lands in an image layer. See web/README.md.
        - node_auth_token
    image: magi-admin-web:local
    container_name: magi-admin-web
    profiles: ["admin"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ADMIN_API_URL: "http://admin-api:8100"   # the admin-api, by service name
    env_file:
      - .env                      # ADMIN_AUTH_TOKEN (== admin-api's), ADMIN_PASSWORD, SESSION_SECRET
    depends_on:
      admin-api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_storage:
  minio_data:
  rustfs_data:
  prometheus_data:

# Build secret for the `web` image: the read:packages token used to install
# @carneirofc/ui. Sourced from the NODE_AUTH_TOKEN env var at build time.
secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN
